name: installer

# Smoke test of the one-command installer on the systems it promises: Linux
# (sh is dash), macOS (sh is bash 3.2) and Windows (get.ps1 / install.ps1, in
# Windows PowerShell 5.1, the one every Windows has). Python 3.10 is the floor
# the installers accept. Runs only when an installer or what it drives changes.
on:
  push:
    branches: [main, beta]
    paths:
      - get.sh
      - install.sh
      - get.ps1
      - install.ps1
      - .gitattributes
      - scripts/squad_settings.py
      - hooks/manifest.json
      - tests/test_get.py
      - tests/test_squad_settings.py
      - tests/test_install_ps1.py
      - tests/test_get_ps1.py
      - tests/test_install_graph.py
      - hooks/graphify.pin
      - hooks/squad-graph.py
      - .github/workflows/installer.yml
  pull_request:
    paths:
      - get.sh
      - install.sh
      - get.ps1
      - install.ps1
      - .gitattributes
      - scripts/squad_settings.py
      - hooks/manifest.json
      - tests/test_get.py
      - tests/test_squad_settings.py
      - tests/test_install_ps1.py
      - tests/test_get_ps1.py
      - tests/test_install_graph.py
      - hooks/graphify.pin
      - hooks/squad-graph.py
      - .github/workflows/installer.yml

permissions:
  contents: read

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 30 || 10 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Lint get.sh as POSIX sh
        if: runner.os == 'Linux'
        run: shellcheck -s sh get.sh
      - name: Compile the settings script
        run: python -m py_compile scripts/squad_settings.py
      - name: Installer test suite (throwaway HOME, file:// clone; says so and exits 0 on Windows)
        run: python tests/test_get.py
      - name: Settings writer unit tests (per-hook matchers)
        run: python tests/test_squad_settings.py
      - name: graphify install step (fake uv, pin file, never graphify install; says so and exits 0 on Windows)
        run: python tests/test_install_graph.py
      - name: "Windows installers (install.ps1 and get.ps1, throwaway profile, file:// clone)"
        if: runner.os == 'Windows'
        shell: bash
        run: |
          python -B tests/test_install_ps1.py
          python -B tests/test_get_ps1.py
