<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neutral artifact_check fixture</title>
<style>
:root{--bg:#ffffff; --text:#1d2433; --accent:#2f5fa7}
@media (prefers-color-scheme: dark){:root{--bg:#14171f; --text:#e8ebf2; --accent:#8db4ee}}
body{margin:0; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif}
</style>
</head>
<body>
<h1>A page in one language, with no brand and no language bar</h1>
<p>It gives the checker a neutral page known to be good: a title, tokens in :root and no local image.</p>
<svg width="24" height="24" role="img" aria-label="Square"><rect width="24" height="24" fill="var(--accent)"/></svg>
</body>
