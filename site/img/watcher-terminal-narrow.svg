<svg xmlns="http://www.w3.org/2000/svg" width="288" height="588" viewBox="0 0 288 588">
  <title>Example squad-watch hook output from a synthetic transcript</title>
  <desc>Example hook output from a synthetic transcript at an artificial 550 thousand tokens of context, generated by scripts/render_site_assets.py.</desc>
  <style>text { font: 14px ui-monospace, "DejaVu Sans Mono", SFMono-Regular, Menlo, Consolas, monospace; fill: #e3e7e4; white-space: pre; } .h { fill: #8fd9bd; }</style>
  <rect width="288" height="588" fill="#121417"/>
  <text x="12" y="26" class="h">[squad-watch] PROACTIVE</text><text x="12" y="47">HANDOFF — context 550k/1.0M</text><text x="12" y="68">(55%), burn 60% of the</text><text x="12" y="89">budget, reread 90%, each</text><text x="12" y="110">turn rereads 55k weighted</text><text x="12" y="131">tokens, a new session pays</text><text x="12" y="152">for itself in 1.2 turn(s).</text><text x="12" y="173">When you close the step in</text><text x="12" y="194">progress, without asking</text><text x="12" y="215">permission and without</text><text x="12" y="236">starting a new front: (1)</text><text x="12" y="257">record on the card what was</text><text x="12" y="278">decided (`agenfk comment</text><text x="12" y="299">&lt;id&gt; &quot;PAUSE: done X,</text><text x="12" y="320">remaining Y, next Z&quot;`); (2)</text><text x="12" y="341">write the handoff with mode</text><text x="12" y="362">A of the `clear-pickup`</text><text x="12" y="383">skill (ground truth by</text><text x="12" y="404">command, short, UNKNOWN for</text><text x="12" y="425">whatever you did not verify;</text><text x="12" y="446">under Next step, what</text><text x="12" y="467">remains of the current</text><text x="12" y="488">request, in order); (3) end</text><text x="12" y="509">your reply with the handoff</text><text x="12" y="530">path and stop. Tell the</text><text x="12" y="551">owner: `/clear` and then</text><text x="12" y="572">`/clear-pickup pickup`.</text>
</svg>
