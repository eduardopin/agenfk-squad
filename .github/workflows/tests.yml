name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  watcher:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile hooks and scripts
        run: python -m py_compile hooks/*.py skills/session-context/scripts/session_context.py
      - name: Check install.sh syntax
        run: bash -n install.sh
      # Some Python tests drive real Node code (the omp extension), so Node is
      # pinned on every leg before them rather than left to the runner image.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Every tests/test_*.py, found by glob: a new test file runs here without
      # editing this workflow. All files run; the step fails if any one fails, or
      # leaves anything in its own TMPDIR (the leak check of scripts/check_temp_leftovers.py,
      # done inside this loop so it costs no second pass of the suite).
      # No bytecode, not even from the scripts a test spawns: a .pyc carries
      # the runner's /home path and would trip the private-paths check below.
      - name: Python test files (every tests/test_*.py)
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(tests/test_*.py)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no tests/test_*.py found"
            exit 1
          fi
          failed=()
          crashed=()
          for t in "${files[@]}"; do
            echo "::group::$t"
            # Each file gets its own empty TMPDIR (Python reads TMPDIR before TEMP and TMP;
            # all three are set for the child processes a test starts). Anything still in it
            # when the file exits is a leak, and the file fails: same loop, no second pass.
            tmp=$(mktemp -d)
            TMPDIR="$tmp" TEMP="$tmp" TMP="$tmp" python -B "$t" || crashed+=("$t")
            echo "::endgroup::"
            # GitHub runs bash steps with -eo pipefail: no `| head` here (SIGPIPE, exit 141, on a big leak)
            # and no bare command that can fail; the listing is read into an array, the first names sliced.
            mapfile -t left < <(ls -A "$tmp")
            if [ "${#left[@]}" -gt 0 ]; then
              n=${#left[@]}
              names=$(printf '%s, ' "${left[@]:0:5}")
              names=${names%, }
              echo "::error file=$t::$t left $n entries in TMPDIR ($names)"
              failed+=("$t")
            fi
            rm -rf "$tmp" || echo "::warning file=$t::could not remove $tmp"
          done
          for t in "${crashed[@]}"; do
            echo "::error file=$t::$t failed"
            case " ${failed[*]-} " in *" $t "*) ;; *) failed+=("$t") ;; esac
          done
          echo "ran ${#files[@]} test files, ${#failed[@]} failed"
          [ "${#failed[@]}" -eq 0 ]
      # Node is the same on every Python leg: run the helper tests once.
      - name: ci-cost changed-ranges tests (floor 23)
        if: matrix.python == '3.12'
        run: |
          set -euo pipefail
          node --test --test-reporter=tap skills/ci-cost/scripts/changed-ranges.test.mjs | tee "$RUNNER_TEMP/ranges.tap"
          passed=$(awk '/^# pass /{print $3}' "$RUNNER_TEMP/ranges.tap")
          if [ -z "${passed:-}" ] || [ "$passed" -lt 23 ]; then
            echo "::error::changed-ranges reported '${passed:-no}' passing tests; expected at least 23."
            exit 1
          fi
      - name: No private paths in the tree (a home directory on Linux, macOS or Windows)
        run: python scripts/check_private_paths.py

  # The same suite on Windows (Git Bash for the loop; PowerShell for the installers, which the tests start).
  # A runner administrator may create symbolic links, so the symlink branches run here too.
  windows:
    runs-on: windows-latest
    timeout-minutes: 20          # a leg takes about 2 minutes
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Git keeps the line endings the repository says (LF), whatever autocrlf is
        run: |
          git config --global core.autocrlf true
          git rm --cached -r -q .
          git reset --hard -q
          if git ls-files --eol | grep -q 'w/crlf'; then echo "::error::a text file is still CRLF in the work tree"; exit 1; fi
      - name: Compile hooks and scripts
        run: python -m py_compile hooks/*.py scripts/*.py skills/session-context/scripts/session_context.py
      - name: Whole test suite (a test that is not for Windows says so and exits 0)
        run: |
          # every file runs, so one failure does not hide the others; the step fails at the end
          failed=""
          for t in tests/test_*.py; do
            echo "::group::$t"
            # Each file gets its own empty TMPDIR; anything left in it when the file exits fails the file.
            # Native Windows Python reads TMPDIR first, then TEMP and TMP: all three get the same
            # Windows-form path (cygpath -m), since Git Bash's /tmp/... is not a path to a native process.
            tmp=$(mktemp -d)
            wtmp=$(cygpath -m "$tmp" 2>/dev/null || echo "$tmp")
            ok=1
            TMPDIR="$wtmp" TEMP="$wtmp" TMP="$wtmp" python -B "$t" || { echo "::error::$t failed"; ok=0; }
            echo "::endgroup::"
            # GitHub runs bash steps with -eo pipefail: no `| head` here (SIGPIPE, exit 141, on a big leak)
            # and no bare command that can fail; the listing is read into an array, the first names sliced.
            mapfile -t left < <(ls -A "$tmp")
            if [ "${#left[@]}" -gt 0 ]; then
              n=${#left[@]}
              names=$(printf '%s, ' "${left[@]:0:5}")
              names=${names%, }
              echo "::error file=$t::$t left $n entries in TMPDIR ($names)"
              ok=0
            fi
            rm -rf "$tmp" || echo "::warning file=$t::could not remove $tmp"
            [ "$ok" -eq 1 ] || failed="$failed $t"
          done
          if [ -n "$failed" ]; then echo "::error::failed:$failed"; exit 1; fi
      - name: No private paths in the tree
        run: python scripts/check_private_paths.py
